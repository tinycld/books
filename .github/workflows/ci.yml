name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE: books
  TEST_USER_LOGIN: user@tinycld.org
  TEST_USER_PW: TestUser1234!
  ADMIN_USER_LOGIN: admin@tinycld.org
  ADMIN_USER_PW: AdminPass1234!

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    steps:
      # 1. This PR's code, checked out into the member slot.
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      # 2. Pin a Node that satisfies bootstrap's engines.node (>=24) so the
      #    assemble step below doesn't depend on whatever ubuntu-latest ships.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # 3. Assemble the workspace root: writes package.json + tinycld.packages.ts
      #    from bootstrap's embedded templates, clones the tinycld member (app
      #    shell + core + package-scripts) as a sibling. The PR's PACKAGE dir is
      #    already there and is skipped.
      - name: Assemble workspace (tinycld + this package)
        working-directory: ws
        run: TINYCLD_REPO_BASE=https://github.com/tinycld npx @tinycld/bootstrap@latest --assemble-only
      # 4. Now switch to the version the assembled workspace pins (ws/.node-version
      #    is written by the assemble step above).
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      # Books commits no go.sum: every dependency resolves through go.work
      # replaces to local dirs, so its own cache key is server/go.mod. The
      # modules the install's schema generation and the Go steps download are
      # core's graph, so the tinycld go.sum files join the key. Without a
      # cache-dependency-path, setup-go looks for a go.sum at the repo root,
      # finds none, and warns on every run.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/tinycld/core/server/go.mod
          cache-dependency-path: |
            ws/books/server/go.mod
            ws/tinycld/server/go.sum
            ws/tinycld/core/server/go.sum
      # 5. Enable corepack so the pnpm version pinned in the workspace root's
      #    package.json "packageManager" field is used. pnpm discovers members
      #    from pnpm-workspace.yaml; node-linker=hoisted (set there) gives an
      #    npm-like flat node_modules so member peerDeps resolve.
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install (workspace root)
        working-directory: ws
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck + unit
        working-directory: ws/${{ env.PACKAGE }}
        run: pnpm exec tinycld-pkg check
      # The ledger's guarantees (rules, posting, immutability, numbering) are
      # proven by the Go tests in server/; tinycld-pkg check runs no Go.
      # go mod download fills go.work.sum, which workspace-mode go test needs.
      - name: Go build
        working-directory: ws/${{ env.PACKAGE }}/server
        run: |
          go mod download
          go build ./...
      - name: Go test
        working-directory: ws/${{ env.PACKAGE }}/server
        run: go test -count=1 ./...

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The suite grows by a screen at a time; one runner takes too long. Each
    # shard builds its own bundle, so the shards share nothing. fail-fast off
    # so one red shard does not hide the result of the others.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      # Pin a Node that satisfies bootstrap's engines.node (>=24) so the
      # assemble step below doesn't depend on whatever ubuntu-latest ships.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Assemble workspace (tinycld + this package)
        working-directory: ws
        run: TINYCLD_REPO_BASE=https://github.com/tinycld npx @tinycld/bootstrap@latest --assemble-only
      # Switch to the version the assembled workspace pins.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/tinycld/core/server/go.mod
          cache-dependency-path: |
            ws/books/server/go.mod
            ws/tinycld/server/go.sum
            ws/tinycld/core/server/go.sum
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install (workspace root)
        working-directory: ws
        run: pnpm install --no-frozen-lockfile
      # Installs the Playwright browser and pre-builds the web bundle. The
      # composite action lives in the tinycld member, assembled at ws/tinycld.
      - name: Configure test env
        uses: ./ws/tinycld/.github/actions/configure-test-env
      - name: E2E
        working-directory: ws/${{ env.PACKAGE }}
        env:
          # The bundle was built by the action above; reuse it (the webServer
          # still seeds + promotes + serves, just doesn't export a second time).
          TINYCLD_E2E_SKIP_EXPORT: '1'
        run: pnpm exec tinycld-pkg test:e2e -- --shard=${{ matrix.shard }}/4
      # Capture Playwright's per-failure artifacts (trace, screenshot,
      # video, error-context.md) so a CI failure can be diagnosed
      # without a re-run. `if: failure()` skips the upload on green
      # runs to save bandwidth + retention.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            ws/${{ env.PACKAGE }}/test-results/
            ws/${{ env.PACKAGE }}/playwright-report/
          retention-days: 14
